name: Supabase Keepalive

# Free-tier Supabase projects auto-pause after 7 days with no user API activity.
# This pings the project's Data API on a schedule so it never gets close.
# See: https://supabase.com/docs/guides/platform/free-project-pausing

on:
  schedule:
    - cron: '0 12 */3 * *' # every 3 days at 12:00 UTC — well inside the 7-day window
  workflow_dispatch: {} # allow manual "Run workflow" for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Data API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          echo "Data API responded with HTTP $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase keepalive ping failed (HTTP $status)"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
